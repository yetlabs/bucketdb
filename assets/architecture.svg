<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1E3A8A"/></marker></defs>
<rect width="1280" height="800" fill="#FFFFFF"/>
<text x="40" y="58" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">How bucketdb works</text>
<text x="40" y="88" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#475569" text-anchor="start">A Postgres-speaking sidecar whose database lives in an S3 bucket: no database server to run.</text>
<rect x="40" y="200" width="250" height="150" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="165" y="240" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Your app</text>
<text x="165" y="270" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">GORM, pgx, psql, Prisma,</text>
<text x="165" y="292" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">any Postgres driver</text>
<text x="165" y="326" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1D4ED8" text-anchor="middle">postgres://localhost:5432/db</text>
<line x1="290" y1="275" x2="372" y2="275" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="372" y1="295" x2="290" y2="295" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="331" y="258" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">Postgres</text>
<text x="331" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1E3A8A" text-anchor="middle">wire v3</text>
<rect x="380" y="130" width="400" height="500" rx="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
<text x="404" y="168" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">bucketdb sidecar</text>
<text x="404" y="192" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">beside the app: a container, a VM, a Lambda extension</text>
<rect x="404" y="216" width="352" height="66" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="424" y="244" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Postgres protocol</text>
<text x="424" y="266" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">startup, simple and extended queries, binary types</text>
<line x1="580.0" y1="283" x2="580.0" y2="297" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="404" y="299" width="352" height="66" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="424" y="327" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">SQL rewrite</text>
<text x="424" y="349" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">sqlparser: Postgres SQL and catalogs → SQLite</text>
<line x1="580.0" y1="366" x2="580.0" y2="380" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="404" y="382" width="352" height="66" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="424" y="410" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">SQLite</text>
<text x="424" y="432" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">the hidden executor: plans, indexes, transactions</text>
<line x1="580.0" y1="449" x2="580.0" y2="463" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="404" y="465" width="352" height="66" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="424" y="493" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">VFS</text>
<text x="424" y="515" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">the database file is the bucket's pages</text>
<line x1="580.0" y1="532" x2="580.0" y2="546" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="404" y="548" width="352" height="66" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="424" y="576" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Page cache</text>
<text x="424" y="598" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">memory, plus local disk (/tmp in Lambda)</text>
<rect x="990" y="130" width="250" height="500" rx="18" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2.5"/>
<text x="1014" y="168" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start">S3 bucket</text>
<text x="1014" y="192" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0369A1" text-anchor="start">s3://bucket/db/</text>
<rect x="1010" y="216" width="210" height="82" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
<text x="1026" y="244" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A" text-anchor="start">manifest.json</text>
<text x="1026" y="266" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">version, pages, segments,</text>
<text x="1026" y="284" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">the file it equals (synced)</text>
<rect x="1010" y="316" width="210" height="82" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
<text x="1026" y="344" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A" text-anchor="start">base/…/00000000…</text>
<text x="1026" y="366" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">the imported file,</text>
<text x="1026" y="384" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">256 pages per object</text>
<rect x="1010" y="416" width="210" height="82" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
<text x="1026" y="444" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A" text-anchor="start">seg/…</text>
<text x="1026" y="466" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">the pages each commit</text>
<text x="1026" y="484" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">wrote, newest wins</text>
<rect x="1010" y="516" width="210" height="82" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
<text x="1026" y="544" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0F172A" text-anchor="start">gc.json</text>
<text x="1026" y="566" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">objects to delete after</text>
<text x="1026" y="584" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">a grace period</text>
<rect x="380" y="662" width="400" height="96" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" stroke-dasharray="7 5"/>
<text x="404" y="696" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">More apps, more sidecars</text>
<text x="404" y="720" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">no server between them: the manifest's If-Match</text>
<text x="404" y="740" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">orders commits; a lost race replays or answers 40001</text>
<line x1="784" y1="710" x2="1050" y2="636" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="662" width="250" height="96" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="60" y="696" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">A local SQLite file</text>
<text x="60" y="720" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">bucketdb import, upsert,</text>
<text x="60" y="740" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start">export (changed pages only)</text>
<path d="M290 760 L290 782 L1180 782 L1180 638" fill="none" stroke="#1E3A8A" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="784" y1="482" x2="984" y2="482" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="984" y1="512" x2="784" y2="512" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="884" y="420" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">commit</text>
<text x="884" y="439" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A8A" text-anchor="middle">PUT segment, then</text>
<text x="884" y="457" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A8A" text-anchor="middle">PUT manifest If-Match</text>
<text x="884" y="542" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">read</text>
<text x="884" y="561" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A8A" text-anchor="middle">ranged GET, cached:</text>
<text x="884" y="579" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#1E3A8A" text-anchor="middle">objects never change</text>
</svg>