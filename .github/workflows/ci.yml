name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tests build with the release profile, without its LTO: the compile halves and no
# test observes the difference.
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The same command a developer runs: clippy, rustdoc, the tests, rustfmt.
      - run: make check
